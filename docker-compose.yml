# Прод-установка: один контейнер, как Portainer. Фронт, API и файловая база
# внутри одного образа, данные и сертификат — в томе redhorse-data.
#
#   docker compose up -d
#
# Внешний Postgres вместо файловой базы — раскомментируй REDHORSE_DATABASE_URL.
services:
  redhorse:
    build: .
    image: redhorse/redhorse:latest
    restart: unless-stopped
    ports:
      # HTTPS, самоподписанный сертификат. Только localhost — заходить через
      # SSH-туннель; чтобы открыть наружу, убери 127.0.0.1.
      - "127.0.0.1:9443:9443"
    volumes:
      # Доступ к сокету равнозначен root на хосте — ради него панель и существует.
      - /var/run/docker.sock:/var/run/docker.sock
      - redhorse-data:/data
    environment:
      # Пусто — администратора создаёт первый вход в течение 5 минут после старта.
      - REDHORSE_ADMIN_USER=${REDHORSE_ADMIN_USER:-admin}
      - REDHORSE_ADMIN_PASSWORD=${REDHORSE_ADMIN_PASSWORD:-}
      # - REDHORSE_DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/redhorse

volumes:
  redhorse-data:
