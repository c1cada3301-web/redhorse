# Прод-установка: один контейнер, как Portainer. Фронт, API и файловая база
# внутри одного образа, данные и сертификат — в томе dala-data.
#
#   docker compose up -d
#
# Внешний Postgres вместо файловой базы — раскомментируй DALA_DATABASE_URL.
services:
  dala:
    build: .
    image: dala/dala:latest
    restart: unless-stopped
    ports:
      - "9443:9443"   # HTTPS, самоподписанный сертификат
      - "9000:9000"   # HTTP; закрой, если панель смотрит наружу
    volumes:
      # Доступ к сокету равнозначен root на хосте — ради него панель и существует.
      - /var/run/docker.sock:/var/run/docker.sock
      - dala-data:/data
    environment:
      # Пусто — администратора создаёт первый вход в течение 5 минут после старта.
      - DALA_ADMIN_USER=${DALA_ADMIN_USER:-admin}
      - DALA_ADMIN_PASSWORD=${DALA_ADMIN_PASSWORD:-}
      # - DALA_DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/dala

volumes:
  dala-data:
